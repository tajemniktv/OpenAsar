name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump to apply when version is not provided
        required: true
        default: patch
        type: choice
        options:
        - patch
        - minor
        - major
      version:
        description: Optional explicit release version, for example 1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Stable Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Require main and a tested rolling build
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$GITHUB_REF_NAME" != "main" ]]; then
          echo "Stable releases must be dispatched from main, not $GITHUB_REF_NAME." >&2
          exit 1
        fi

        if ! git rev-parse -q --verify refs/tags/rolling-nightly >/dev/null; then
          echo "No rolling-nightly tag exists. Run the Rolling Nightly workflow successfully first." >&2
          exit 1
        fi

        rolling_sha="$(git rev-list -n 1 rolling-nightly)"
        if [[ "$rolling_sha" != "$GITHUB_SHA" ]]; then
          echo "Current main ($GITHUB_SHA) is not the tested rolling-nightly commit ($rolling_sha)." >&2
          echo "Run Rolling Nightly for this commit before publishing a stable release." >&2
          exit 1
        fi

    - name: Determine release version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
        REQUESTED_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        python3 <<'PY'
        import os
        import re
        import subprocess

        requested = os.environ.get('REQUESTED_VERSION', '').strip()
        bump = os.environ['BUMP']

        versions = []
        for tag in subprocess.check_output(['git', 'tag', '--list', 'v*'], text=True).splitlines():
            match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag)
            if match:
                versions.append(tuple(map(int, match.groups())))

        latest = max(versions) if versions else (0, 0, 0)

        if requested:
            match = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)', requested)
            if not match:
                raise SystemExit('version must be a stable semantic version such as 1.2.3')
            version_tuple = tuple(map(int, match.groups()))
            if version_tuple <= latest:
                raise SystemExit(f'explicit version {requested} must be newer than latest stable v{".".join(map(str, latest))}')
        else:
            major, minor, patch = latest
            if bump == 'major':
                version_tuple = (major + 1, 0, 0)
            elif bump == 'minor':
                version_tuple = (major, minor + 1, 0)
            elif bump == 'patch':
                version_tuple = (major, minor, patch + 1)
            else:
                raise SystemExit(f'unsupported bump: {bump}')

        version = '.'.join(map(str, version_tuple))
        tag = f'v{version}'

        if subprocess.run(['git', 'rev-parse', '-q', '--verify', f'refs/tags/{tag}'], stdout=subprocess.DEVNULL).returncode == 0:
            raise SystemExit(f'tag {tag} already exists')

        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'version={version}\n')
            output.write(f'tag={tag}\n')
        PY

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Pack stable build
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        npm i -g asar@3.2.0
        node scripts/pack.js \
          --update-repo "$GITHUB_REPOSITORY" \
          --version "$VERSION" \
          --output app.asar

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: stable-asar
        path: app.asar
        retention-days: 7

  release:
    name: Publish Stable Release
    needs: build
    runs-on: ubuntu-latest
    # Required to create and push the immutable release tag and GitHub Release.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: stable-asar
        path: artifact

    - name: Publish stable release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.build.outputs.version }}
        TAG: ${{ needs.build.outputs.tag }}
      shell: bash
      run: |
        set -euo pipefail
        cp artifact/app.asar .

        # Revalidate mutable refs immediately before publication.
        git fetch --force origin main:refs/remotes/origin/main
        current_main="$(git rev-parse refs/remotes/origin/main)"
        rolling_sha="$(git ls-remote origin refs/tags/rolling-nightly | awk '{print $1}')"
        if [[ "$current_main" != "$GITHUB_SHA" || "$rolling_sha" != "$GITHUB_SHA" ]]; then
          echo "Release source is no longer current and tested; refusing to publish." >&2
          echo "main=$current_main rolling-nightly=$rolling_sha workflow=$GITHUB_SHA" >&2
          exit 1
        fi

        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || gh release view "$TAG" >/dev/null 2>&1; then
          echo "$TAG already exists remotely; refusing to overwrite an immutable release." >&2
          exit 1
        fi

        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git tag -a "$TAG" "$GITHUB_SHA" -m "OpenAsar $VERSION"
        git push origin "$TAG"

        gh release create "$TAG" app.asar \
          --verify-tag \
          --latest \
          --generate-notes \
          --title "OpenAsar $VERSION"

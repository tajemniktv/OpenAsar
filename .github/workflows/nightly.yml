name: Nightly

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'scripts/**'
    - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Pack base asar
      run: |
        npm i -g asar
        sed -i -e "s/nightly/nightly-$(git rev-parse HEAD | cut -c 1-7)/" src/index.js
        node scripts/strip.js
        npx asar pack src app.asar

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: built-asar
        path: app.asar
        retention-days: 1


  test-linux-stable:
    name: Test Linux Stable

    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: |
        cp artifact/app.asar .

    - name: Download Client with OpenAsar
      run: |
        bash scripts/setupLinuxDistroTest.sh stable Discord

        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        cp app.asar Discord/resources/app.asar

        # Keep the smoke test self-contained instead of exercising update services.
        mkdir -p "$RUNNER_TEMP/openasar-discord"
        printf '%s\n' '{"SKIP_HOST_UPDATE":true,"SKIP_MODULE_UPDATE":true}' > "$RUNNER_TEMP/openasar-discord/settings.json"

        # workaround https://github.com/electron/electron/issues/42510
        sudo chown root ./Discord/chrome-sandbox
        sudo chmod 4755 ./Discord/chrome-sandbox

    - name: Check if Discord will startup
      env:
        DISCORD_USER_DATA_DIR: ${{ runner.temp }}/openasar-discord
        OPENASAR_QUICKSTART: '1'
      run: |
        xvfb-run -e /dev/stdout ./Discord/Discord --enable-logging 2>&1 | tee discord-startup.log
        grep -m1 "ABRA" discord-startup.log
      timeout-minutes: 3

  test-linux-canary:
    name: Test Linux Canary

    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: |
        cp artifact/app.asar .

    - name: Download Client with OpenAsar
      run: |
        bash scripts/setupLinuxDistroTest.sh canary DiscordCanary

        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        cp app.asar DiscordCanary/resources/app.asar

        # Keep the smoke test self-contained instead of exercising update services.
        mkdir -p "$RUNNER_TEMP/openasar-discord"
        printf '%s\n' '{"SKIP_HOST_UPDATE":true,"SKIP_MODULE_UPDATE":true}' > "$RUNNER_TEMP/openasar-discord/settings.json"

        # workaround https://github.com/electron/electron/issues/42510
        sudo chown root ./DiscordCanary/chrome-sandbox
        sudo chmod 4755 ./DiscordCanary/chrome-sandbox

    - name: Check if Discord will startup
      env:
        DISCORD_USER_DATA_DIR: ${{ runner.temp }}/openasar-discord
        OPENASAR_QUICKSTART: '1'
      run: |
        xvfb-run -e /dev/stdout ./DiscordCanary/DiscordCanary --enable-logging 2>&1 | tee discord-startup.log
        grep -m1 "ABRA" discord-startup.log
      timeout-minutes: 3

  test-win-stable:
    name: Test Windows Stable

    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: |
        cp artifact/app.asar .

    - name: Setup Client
      shell: bash
      run: |
        node scripts/downloadWin.js
        tar xf client.tar

        # Install OpenAsar build and setup environment
        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        sed -r -i "s/if\(next!=cur&&!options\?\.allowObsoleteHost\)/if\(false\)                                 /" app.asar
        cp -f app.asar files/resources/app.asar
        mkdir discord
        cp -rf files/ discord/app-1.0.0
        cd discord/app-1.0.0
        mkdir modules

    - name: Check if Discord will startup
      run: |
        cd discord/app-1.0.0
        ./Discord.exe | grep -m1 "ABRA"
      timeout-minutes: 3
      shell: bash

  test-win-canary:
    name: Test Windows Canary

    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: |
        cp artifact/app.asar .

    - name: Setup Client
      shell: bash
      run: |
        node scripts/downloadWin.js canary
        tar xf client.tar

        # Install OpenAsar build and setup environment
        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        sed -r -i "s/if\(next!=cur&&!options\?\.allowObsoleteHost\)/if\(false\)                                 /" app.asar
        cp -f app.asar files/resources/app.asar
        mkdir discord
        cp -rf files/ discord/app-1.0.0
        cd discord/app-1.0.0
        mkdir modules

    - name: Check if Discord will startup
      run: |
        cd discord/app-1.0.0
        ./DiscordCanary.exe | grep -m1 "ABRA"
      timeout-minutes: 3
      shell: bash

  release:
    name: Release
    needs:
      - build
      # - test-linux
      # - test-win
    runs-on: ubuntu-latest
    # Required to update the nightly tag and release.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: |
        cp artifact/app.asar .

    - name: GitHub Release
      run: |
        git tag -d nightly || true
        git push origin --delete nightly || true
        git tag nightly
        git push origin nightly
        if ! gh release download nightly --pattern app.asar --output old.asar; then
          cp app.asar old.asar
        fi
        gh release delete ${{ env.VERSION }} -y || true
        gh release create ${{ env.VERSION }} -t "Nightly" -n "$(bash scripts/nightlyNotes.sh)" ${{ env.FILES }}
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        VERSION: 'nightly'
        FILES: app.asar

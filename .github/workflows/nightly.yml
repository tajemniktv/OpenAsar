name: Rolling Nightly

on:
  push:
    branches: [ main ]
    paths:
    - 'src/**'
    - 'scripts/**'
    - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Require main
      shell: bash
      run: |
        if [[ "$GITHUB_REF_NAME" != "main" ]]; then
          echo "Rolling Nightly must run from main, not $GITHUB_REF_NAME." >&2
          exit 1
        fi

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Determine rolling version
      id: version
      shell: bash
      run: |
        python3 <<'PY'
        import os
        import re
        import subprocess

        versions = []
        for tag in subprocess.check_output(['git', 'tag', '--list', 'v*'], text=True).splitlines():
            match = re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag)
            if match:
                versions.append(tuple(map(int, match.groups())))

        if versions:
            major, minor, patch = max(versions)
            patch += 1
        else:
            major, minor, patch = 0, 0, 1

        short_sha = os.environ['GITHUB_SHA'][:7]
        run_number = int(os.environ['GITHUB_RUN_NUMBER'])
        version = f'{major}.{minor}.{patch}-nightly.{run_number}+{short_sha}'

        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'version={version}\n')
        PY

    - name: Pack rolling build
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        npm i -g asar
        node scripts/pack.js \
          --update-repo "$GITHUB_REPOSITORY" \
          --update-channel rolling-nightly \
          --version "$VERSION" \
          --output app.asar

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: built-asar
        path: app.asar
        retention-days: 1

  test-linux-stable:
    name: Test Linux Stable
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: cp artifact/app.asar .

    - name: Download Client with OpenAsar
      run: |
        bash scripts/setupLinuxDistroTest.sh stable Discord

        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        cp app.asar Discord/resources/app.asar

        # The setup helper disables build_info.newUpdater; keep the legacy updater offline too.
        mkdir -p "$RUNNER_TEMP/openasar-discord"
        printf '%s\n' '{"SKIP_HOST_UPDATE":true,"SKIP_MODULE_UPDATE":true}' > "$RUNNER_TEMP/openasar-discord/settings.json"

        # workaround https://github.com/electron/electron/issues/42510
        sudo chown root ./Discord/chrome-sandbox
        sudo chmod 4755 ./Discord/chrome-sandbox

    - name: Check if Discord will startup
      env:
        DISCORD_USER_DATA_DIR: ${{ runner.temp }}/openasar-discord
        OPENASAR_QUICKSTART: '1'
      run: |
        set -o pipefail
        xvfb-run -e /dev/stdout ./Discord/Discord --enable-logging 2>&1 | tee discord-startup.log
        grep -m1 "ABRA" discord-startup.log
      timeout-minutes: 3

  test-linux-canary:
    name: Test Linux Canary
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: cp artifact/app.asar .

    - name: Download Client with OpenAsar
      run: |
        bash scripts/setupLinuxDistroTest.sh canary DiscordCanary

        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        cp app.asar DiscordCanary/resources/app.asar

        # The setup helper disables build_info.newUpdater; keep the legacy updater offline too.
        mkdir -p "$RUNNER_TEMP/openasar-discord"
        printf '%s\n' '{"SKIP_HOST_UPDATE":true,"SKIP_MODULE_UPDATE":true}' > "$RUNNER_TEMP/openasar-discord/settings.json"

        # workaround https://github.com/electron/electron/issues/42510
        sudo chown root ./DiscordCanary/chrome-sandbox
        sudo chmod 4755 ./DiscordCanary/chrome-sandbox

    - name: Check if Discord will startup
      env:
        DISCORD_USER_DATA_DIR: ${{ runner.temp }}/openasar-discord
        OPENASAR_QUICKSTART: '1'
      run: |
        set -o pipefail
        xvfb-run -e /dev/stdout ./DiscordCanary/DiscordCanary --enable-logging 2>&1 | tee discord-startup.log
        grep -m1 "ABRA" discord-startup.log
      timeout-minutes: 3

  test-win-stable:
    name: Test Windows Stable
    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: cp artifact/app.asar .

    - name: Setup Client
      shell: bash
      run: |
        node scripts/downloadWin.js
        tar xf client.tar

        # Install OpenAsar build and setup environment
        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        sed -r -i "s/if\(next!=cur&&!options\?\.allowObsoleteHost\)/if\(false\)                                 /" app.asar
        cp -f app.asar files/resources/app.asar
        mkdir discord
        cp -rf files/ discord/app-1.0.0
        cd discord/app-1.0.0
        mkdir modules

    - name: Check if Discord will startup
      run: |
        cd discord/app-1.0.0
        ./Discord.exe | grep -m1 "ABRA"
      timeout-minutes: 3
      shell: bash

  test-win-canary:
    name: Test Windows Canary
    needs: build
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js v24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.x

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: cp artifact/app.asar .

    - name: Setup Client
      shell: bash
      run: |
        node scripts/downloadWin.js canary
        tar xf client.tar

        # Install OpenAsar build and setup environment
        sed -r -i "s/const config=require\('.\/config'\);/console.log\('ABRA'\);app.exit\(\);  /" app.asar
        sed -r -i "s/if\(next!=cur&&!options\?\.allowObsoleteHost\)/if\(false\)                                 /" app.asar
        cp -f app.asar files/resources/app.asar
        mkdir discord
        cp -rf files/ discord/app-1.0.0
        cd discord/app-1.0.0
        mkdir modules

    - name: Check if Discord will startup
      run: |
        cd discord/app-1.0.0
        ./DiscordCanary.exe | grep -m1 "ABRA"
      timeout-minutes: 3
      shell: bash

  release:
    name: Publish Rolling Nightly
    needs:
      - build
      - test-linux-stable
      - test-linux-canary
      - test-win-stable
      - test-win-canary
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Retrieve artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: built-asar
        path: artifact

    - name: Extract artifact
      run: cp artifact/app.asar .

    - name: Publish rolling prerelease
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        set -euo pipefail

        # Preserve the previous build for release-note size comparisons.
        if ! gh release download rolling-nightly --pattern app.asar --output old.asar; then
          cp app.asar old.asar
        fi

        # Migrate the old channel name once this workflow lands.
        gh release delete nightly --yes --cleanup-tag || true
        git push origin --delete nightly || true

        # A rolling channel deliberately reuses one tag and one release URL.
        gh release delete rolling-nightly --yes --cleanup-tag || true
        git push origin --delete rolling-nightly || true
        git tag -f rolling-nightly "$GITHUB_SHA"
        git push origin rolling-nightly

        notes="$(bash scripts/nightlyNotes.sh)"
        gh release create rolling-nightly app.asar \
          --verify-tag \
          --prerelease \
          --title "Rolling Nightly $VERSION" \
          --notes "$notes"
